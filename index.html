<style>.demarrage{margin-top:28px;color:var(--discret);font-size:.92rem}
/* L'ouverture (Taha, 22/11/2026 : « une animation au début, créative et belle ») : le bol se dessine, se remplit,
   la vapeur monte, le nom apparaît ; elle dure le temps du chargement (1,9 s au moins), puis s'efface. */
.ouverture{position:fixed;inset:0;z-index:100;display:grid;place-items:center;align-content:center;gap:18px;background:#111312;
  transition:opacity .45s ease,transform .45s ease}
.ouverture.fini{opacity:0;transform:scale(1.06);pointer-events:none}
.ouv-bol{width:min(44vw,190px);height:auto;overflow:visible;filter:drop-shadow(0 0 0 rgba(200,240,75,0));animation:ouvLueur 1.6s .9s ease-out both}
.ouv-contour{stroke-dasharray:900;stroke-dashoffset:900;animation:ouvTrait .7s .05s cubic-bezier(.6,0,.3,1) forwards}
.ouv-bord{transform-origin:256px 262px;transform:scaleX(0);animation:ouvBord .45s .45s cubic-bezier(.2,.9,.3,1.2) forwards}
.ouv-vapeur{stroke-dasharray:120;stroke-dashoffset:120;opacity:0;animation:ouvVapeur .5s forwards,ouvMonte 2.4s ease-in-out infinite}
.ouv-vapeur.v1{animation-delay:.7s,1.2s}.ouv-vapeur.v2{animation-delay:.8s,1.4s}.ouv-vapeur.v3{animation-delay:.9s,1.6s}
.ouv-nom{margin:0;font:650 1.55rem/1.1 Geist,system-ui,sans-serif;letter-spacing:-.02em;color:#f0efec;display:flex}
.ouv-nom span{display:inline-block;opacity:0;transform:translateY(10px);animation:ouvLettre .45s cubic-bezier(.2,.8,.2,1) forwards;white-space:pre}
.ouv-point{width:6px;height:6px;border-radius:50%;background:#c8f04b;opacity:0;animation:ouvPoint 1.2s 1.6s ease-in-out infinite}
@keyframes ouvTrait{to{stroke-dashoffset:0}}
@keyframes ouvBord{to{transform:scaleX(1)}}
@keyframes ouvVapeur{to{stroke-dashoffset:0;opacity:1}}
@keyframes ouvMonte{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-10px);opacity:.55}}
@keyframes ouvLettre{to{opacity:1;transform:none}}
@keyframes ouvLueur{to{filter:drop-shadow(0 0 22px rgba(200,240,75,.35))}}
@keyframes ouvPoint{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.ouverture *{animation-duration:1ms!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>

<script>
// iPhone, appli installée (Taha, 22/11/2026, capture) : iOS remonte la page sous la barre d'état sans la rallonger en
// bas ; tout ce qui est collé en bas s'arrête alors 59 points trop haut et laisse un rectangle vide. On mesure ce trou
// (hauteur de l'écran − hauteur de la page) et on recolle en bas ce qui doit y être (variable --trou-bas).
(() => {
  const ios = /iPhone|iPod/.test(navigator.userAgent) && (navigator.standalone === true || matchMedia("(display-mode: standalone)").matches);
  const regle = () => {
    const trou = ios && innerHeight > innerWidth ? Math.round(screen.height - innerHeight) : 0;
    document.documentElement.style.setProperty("--trou-bas", `${trou > 0 && trou < 120 ? trou : 0}px`);
  };
  regle(); addEventListener("resize", regle); addEventListener("orientationchange", () => setTimeout(regle, 300));
})();
</script>
<div class="ouverture" id="ouverture" aria-hidden="true">
  <svg class="ouv-bol" viewBox="0 0 512 512" role="presentation">
    <defs><clipPath id="ouvRemplir"><rect x="0" y="430" width="512" height="200"><animate attributeName="y" from="430" to="262" begin="0.45s" dur="0.7s" fill="freeze" calcMode="spline" keySplines=".3 0 .2 1"/></rect></clipPath></defs>
    <path d="M96 262h320c0 96-72 162-160 162S96 358 96 262z" fill="#c8f04b" clip-path="url(#ouvRemplir)"/>
    <path class="ouv-contour" d="M96 262h320c0 96-72 162-160 162S96 358 96 262z" fill="none" stroke="#c8f04b" stroke-width="10" stroke-linejoin="round"/>
    <path class="ouv-bord" d="M76 262h360" stroke="#f0efec" stroke-width="22" stroke-linecap="round"/>
    <path class="ouv-vapeur v1" d="M200 206c-20-26 20-40 0-72" fill="none" stroke="#f0efec" stroke-width="18" stroke-linecap="round"/>
    <path class="ouv-vapeur v2" d="M256 206c-20-26 20-40 0-72" fill="none" stroke="#f0efec" stroke-width="18" stroke-linecap="round"/>
    <path class="ouv-vapeur v3" d="M312 206c-20-26 20-40 0-72" fill="none" stroke="#f0efec" stroke-width="18" stroke-linecap="round"/>
  </svg>
  <p class="ouv-nom" id="ouvNom">Mon Meal Prep</p>
  <span class="ouv-point"></span>
</div>
<script>
// Les lettres du nom arrivent une à une ; l'ouverture s'efface dès que l'appli a affiché quelque chose (1,9 s au moins).
(() => {
  const nom = document.getElementById("ouvNom"), t0 = performance.now();
  nom.innerHTML = [...nom.textContent].map((c, i) => `<span style="animation-delay:${(0.75 + i * 0.03).toFixed(3)}s">${c}</span>`).join("");
  const fin = () => { const o = document.getElementById("ouverture"); if (!o || o.classList.contains("fini")) return;
    setTimeout(() => { o.classList.add("fini"); setTimeout(() => o.remove(), 500); }, Math.max(0, 1900 - (performance.now() - t0))); };
  addEventListener("DOMContentLoaded", () => {
    const c = document.getElementById("contenu");
    new MutationObserver((m, obs) => { if (!c.querySelector(".os")) { obs.disconnect(); fin(); } }).observe(c, { childList: true });
    setTimeout(fin, 12000);                               // jamais bloqué derrière
  });
})();
</script>
